            unsupported_provider: El proveedor no admite esta comprobación
          worker:
            title: Verificación del worker
            description: Las comprobaciones anteriores se ejecutaron desde este proceso web. La mayor parte del trabajo de IA (respuestas del asistente, procesamiento de PDF, embeddings, categorización automática y detección de comercios) se ejecuta en realidad en un proceso worker de Sidekiq, que puede tener otro acceso a red, DNS, reglas de proxy o incluso otras credenciales. Pon en cola una comprobación para verificar la configuración y conectividad del propio worker.
            verify_button: Verificar configuración del worker
            coverage_notice: 'Cada comprobación verifica un único proceso worker: el que la recoja. Si hay más de una réplica, un resultado correcto no garantiza que todos los workers estén bien; vuelve a poner la comprobación en cola para probar otro.'
            empty:
              title: Ningún worker ha respondido todavía
              description: Pulsa «Verificar configuración del worker» para poner en cola una comprobación asíncrona. El resultado aparecerá aquí cuando un proceso worker la recoja.
            labels:
              process: Proceso worker
              checked_at: Comprobado
              configuration: Configuración
            configuration_statuses:
              match: Coincide con la web
              mismatch: Distinta de la web
            statuses:
              passing: Correcto
              failing: Con fallos
              stale: Desactualizado
            settings_origin:
              title: "¿Qué ajustes requieren reiniciar?"
              database_backed: 'Los ajustes de proveedor, modelo y clave de API que cambies en Ajustes → Autoalojamiento se guardan en la base de datos. rails-settings-cached invalida la caché compartida al guardar, así que tanto la web como el worker usan el nuevo valor en la siguiente petición o tarea: no hace falta reiniciar.'
              env_backed: La configuración de embeddings, y cualquier valor definido solo con una variable de entorno, se fija al arrancar cada contenedor. Rails no puede cambiar el entorno de otro contenedor, así que para cambiarlos hay que reiniciar o recrear los servicios web y worker. Una herramienta de despliegue que solo reinicie uno de ellos (despliegue parcial, un Secret actualizado sin reiniciar el pod) no aplicará el cambio.
          local_setup:
            title: Configuración local recomendada
            description: Ejecuta el LLM con tu endpoint local compatible con OpenAI, guarda los vectores de documentos en pgvector y apunta los ajustes de embeddings a un endpoint de embeddings compatible con OpenAI. La imagen de PostgreSQL debe incluir la extensión vector y las dimensiones de embeddings deben coincidir con el modelo seleccionado.
