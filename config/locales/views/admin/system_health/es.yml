        ai:
          run_checks: Volver a comprobar
          last_checked: Comprobaciones completadas hace %{time_ago}. Los resultados se guardan en caché brevemente.
          not_checked_help: Abre directamente la URL de estado de la IA o ejecuta las comprobaciones para verificar que el servicio responde.
          loading: Ejecutando comprobaciones…
          alerts:
            custom_openai:
              title: Falló la comprobación del almacén vectorial alojado en este endpoint personalizado
              message: El endpoint configurado no superó la comprobación de /v1/vector_stores. La mayoría de endpoints locales y compatibles con OpenAI no implementan esa API. Es posible que el chat y el procesamiento de PDF sigan funcionando; para la configuración local habitual, usa pgvector con un endpoint de embeddings aparte. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            function_calling_unsupported:
              title: El modelo no admite llamadas a funciones
              message: El endpoint respondió a una petición de chat normal, pero rechazó la misma petición con el parámetro tools. El asistente de IA lee cuentas, transacciones y posiciones mediante llamadas a funciones, así que el chat seguirá fallando (a menudo con un 404 poco claro) hasta que uses un modelo que admita herramientas. Elige un modelo cuyo proveedor documente soporte para llamadas a funciones. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            function_calling_not_used:
              title: El modelo respondió sin llamar a la herramienta que se le pidió
              message: El endpoint aceptó el parámetro tools, pero el modelo respondió con texto en lugar de llamar a la herramienta de comprobación. Sin llamadas a herramientas, el asistente de IA no puede leer datos financieros, así que el chat puede no responder nada o inventarse cifras. Mejor elige un modelo cuyo proveedor documente soporte para llamadas a funciones.
            llm_probe_failed:
              title: Falló la comprobación del LLM
              message: Fulas Bank no pudo verificar el endpoint y el modelo configurados. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            llm_model_not_available:
              title: El modelo de IA configurado no está disponible
              message: El endpoint respondió, pero no incluyó ni sirvió el modelo configurado. Elige un modelo activo del proveedor seleccionado y vuelve a comprobar. Para Gemini a través de una capa compatible con OpenAI, usa un modelo con soporte actual, como gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Falló la comprobación sintética de extracción de texto de PDF
              message: Fulas Bank no pudo completar el proceso que extrae localmente el texto del PDF y lo envía al modelo configurado. No se ha enviado ningún dato de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            pdf_vision_processing_failed:
              title: Falló la comprobación sintética de PDF por visión/nativa
              message: Fulas Bank no pudo completar el procesamiento del PDF como imagen o documento nativo con el modelo configurado. No se ha enviado ningún dato de clientes. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            vector_probe_failed:
              title: Falló la comprobación de búsqueda de documentos
              message: Fulas Bank no pudo verificar el almacén vectorial seleccionado ni todos los servicios de embeddings necesarios. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            pgvector_extension_not_enabled:
              title: La extensión vector de PostgreSQL no está activada
              message: El adaptador pgvector está seleccionado, pero PostgreSQL no tiene activada la extensión vector en esta base de datos. Usa una imagen de PostgreSQL que incluya pgvector, activa la extensión como propietario de la base de datos o superusuario y vuelve a ejecutar las migraciones con VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Falta la tabla vector_store_chunks
              message: La extensión pgvector está activada, pero no se encontró la tabla de fragmentos. Revisa el estado de las migraciones y vuelve a ejecutar la del almacén vectorial con VECTOR_STORE_PROVIDER=pgvector para que Fulas Bank cree vector_store_chunks.
            pgvector_probe_failed:
              title: Falló la comprobación de almacenamiento de pgvector
              message: Fulas Bank no pudo consultar la tabla de fragmentos de pgvector. Revisa los permisos de PostgreSQL, la extensión vector y la migración de vector_store_chunks. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            embedding_dimensions_mismatch:
              title: Las dimensiones de los embeddings no coinciden
              message: El endpoint de embeddings devolvió un vector cuya longitud no coincide con EMBEDDING_DIMENSIONS. Configura EMBEDDING_MODEL y EMBEDDING_DIMENSIONS con el tamaño de vector documentado del modelo, reinicia Fulas Bank para que se aplique el entorno y, si los datos existentes usaban otro tamaño, modifica o vuelve a crear la columna o tabla de embeddings de pgvector y vuelve a generar los embeddings de los documentos.
            embedding_probe_timeout:
              title: La comprobación de embeddings superó el tiempo de espera
              message: El endpoint de embeddings no respondió antes de AI_HEALTH_PROBE_TIMEOUT. Aumenta ese tiempo de espera si el proveedor es lento y reinicia Fulas Bank para que se aplique en todos los procesos. Si las llamadas normales al chat de IA también se agotan, aumenta OPENAI_REQUEST_TIMEOUT por separado.
            embedding_probe_failed:
              title: Falló la comprobación de embeddings
              message: Fulas Bank no pudo crear un embedding de prueba con el endpoint y el modelo configurados. Revisa EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN y los registros del proveedor de embeddings. El fallo se ha registrado en Ajustes → Registros de depuración y en Rails.logger.
            qdrant:
              title: Qdrant aún no está implementado
              message: El adaptador de Qdrant está preparado, pero la subida y búsqueda de documentos fallan por ahora. Selecciona OpenAI o pgvector para la búsqueda de documentos.
            missing_vector_store:
              title: No hay ningún almacén vectorial configurado
              message: Los documentos subidos no se pueden indexar ni buscar hasta que se configure un adaptador de almacén vectorial y sus requisitos.
            unavailable_vector_store:
              title: El almacén vectorial seleccionado no está disponible
              message: Revisa los requisitos del adaptador más abajo. Para pgvector, la base de datos debe tener la extensión vector o una tabla vector_store_chunks existente.
          llm:
            title: LLM y procesamiento de PDF
            description: Las comprobaciones verifican el modelo configurado, le piden una llamada a función sencilla como hace el asistente y después prueban por separado la extracción de texto y el procesamiento por visión/nativo con un PDF sintético de una página sin datos de clientes. Las credenciales nunca se muestran.
          vector_store:
            title: Almacén vectorial y búsqueda de documentos
            description: La comprobación consulta la API del almacén vectorial alojado o prueba la tabla de pgvector y crea un embedding corto sin guardarlo.
