      payroll_deducted: Se descuenta de la nómina
      payroll_deducted_hint: "La empresa te descuenta la cuota de la nómina y paga ella al banco: el dinero no pasa por tus cuentas. Cada mes, el día de pago, la app apunta en este préstamo el ingreso de nómina y el gasto de la cuota, y baja la deuda."
