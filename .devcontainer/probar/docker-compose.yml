# Lightweight stack for trying Fulas Bank in a GitHub Codespace: the app
# (web + Sidekiq via Procfile.dev), PostgreSQL and Redis. Unlike the main
# dev container it skips Selenium, which is only needed for system tests.
x-db-env: &db_env
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_PASSWORD: postgres

services:
  app:
    # The image is built beforehand by initializeCommand (devcontainer.json)
    # with a plain `docker build`. If compose built it, the Dev Containers
    # extension would pass it a Dockerfile from a temp folder, and newer
    # Docker Desktop versions (compose builds through "bake") refuse to read
    # files outside the project without an extra permission.
    image: fulas-bank-probar
    pull_policy: never
    volumes:
      - ../.bashrc:/root/.bashrc:ro,cached
      - ../..:/workspace:cached
      - bundle_cache:/bundle
    # Keeps the container alive; the app is started by hand with bin/probar.
    command: sleep infinity
    environment:
      <<: *db_env
      DB_HOST: db
      BINDING: "0.0.0.0"
      BUNDLE_PATH: /bundle
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    restart: unless-stopped

  db:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      <<: *db_env

volumes:
  postgres-data:
  redis-data:
  bundle_cache:
