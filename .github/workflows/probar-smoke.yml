name: Probar smoke test (temporary)

on: pull_request

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips postgresql-client libpq-dev
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@97ecb7b512899eb71ab1bf2310a624c6f1589ac6 # v1.308.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: gem install foreman
      - name: Seed a dev user without encryption, like the existing Codespace
        run: |
          bin/rails db:prepare
          bin/rails runner 'f = Family.create!(name: "Smoke"); User.create!(family: f, email: "smoke@example.com", password: "Password1!x", role: :admin, onboarded_at: Time.current); puts User.count'
      - name: Start bin/probar in production mode (skip demo data)
        run: |
          mkdir -p tmp && touch tmp/.probar-demo-loaded
          nohup bin/probar > probar.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://localhost:3000/sessions/new && break; sleep 5; done
          cat probar.log | tail -40
          code=$(curl -s -o /tmp/page.html -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:3000/sessions/new)
          echo "status $code"; grep -o '<title>[^<]*' /tmp/page.html
          test "$code" = "200"
      - name: Log in through the production server
        run: |
          jar=/tmp/cookies
          # The app marks cookies Secure (it sits behind HTTPS in Codespaces);
          # curl talks plain HTTP here, so clear the flag to send them back.
          unsecure() { sed -i -E 's/^([^#\t]*\t[^\t]*\t[^\t]*\t)TRUE\t/\1FALSE\t/; s/^#HttpOnly_([^\t]*\t[^\t]*\t[^\t]*\t)TRUE\t/#HttpOnly_\1FALSE\t/' $jar; }
          page=$(curl -s -c $jar -H 'X-Forwarded-Proto: https' http://localhost:3000/sessions/new); unsecure
          token=$(echo "$page" | grep -o 'name="authenticity_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"$//')
          code=$(curl -s -o /tmp/login.html -w '%{http_code}' -b $jar -c $jar -H 'X-Forwarded-Proto: https' -H 'Origin: https://elsewhere.app.github.dev' \
            --data-urlencode "authenticity_token=$token" --data-urlencode "email=smoke@example.com" --data-urlencode "password=Password1!x" \
            http://localhost:3000/sessions); unsecure
          echo "::notice title=login::status $code token=${#token}"
          code2=$(curl -s -o /tmp/home.html -w '%{http_code}' -b $jar -H 'X-Forwarded-Proto: https' http://localhost:3000/)
          echo "::notice title=home::status $code2 $(grep -o '<title>[^<]*' /tmp/home.html)"
          if [ "$code2" != "200" ] || ! { [ "$code" = "302" ] || [ "$code" = "303" ]; }; then
            echo "::error title=log::$(tail -60 probar.log | tr '\n' '|' | cut -c1-3500)"
            echo "::error title=login body::$(head -c 1500 /tmp/login.html | tr '\n' ' ')"
            exit 1
          fi
